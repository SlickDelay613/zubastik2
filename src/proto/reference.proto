syntax = "proto3";

option java_package = "grpc.reference";
option java_multiple_files = true;

service ReferenceService {
  rpc ResolvePolicyType (PolicyTypeRequest) returns (PolicyTypeResponse);
  rpc ValidateCustomer (CustomerValidationRequest) returns (ValidationResponse);
  rpc ValidateDamage (DamageValidationRequest) returns (ValidationResponse);
  rpc CalculatePremium (PremiumRequest) returns (PremiumResponse);
  rpc ValidatePayout (PayoutValidationRequest) returns (ValidationResponse);
  rpc GenerateNumber (NumberRequest) returns (NumberResponse);
}

message PolicyTypeRequest { string type_code = 1; string trace_id = 2; }
message PolicyTypeResponse { bool exists = 1; string internal_type = 2; }

message CustomerValidationRequest { string name = 1; string trace_id = 2; }
message DamageValidationRequest { double damage_amount = 1; string trace_id = 2; }
message ValidationResponse { bool is_valid = 1; string error_message = 2; }

message PremiumRequest { double coverage_amount = 1; double base_rate_percent = 2; string trace_id = 3; }
message PremiumResponse { bool is_valid = 1; double premium_amount = 2; string error_message = 3; }

message PayoutValidationRequest { double payout_amount = 1; string trace_id = 2; }

message NumberRequest { string class_name = 1; }
message NumberResponse { string generated_number = 1; }